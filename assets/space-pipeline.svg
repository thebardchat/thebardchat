<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="The BGKPJR Space Pipeline — Earth surface to LEO via maglev rail; LEO to lunar orbit via Space Tug; lunar orbit to surface via Blue Moon Mk2 / SpaceX HLS lander; empty pods become regolith-filled radiation-proof base structures">
  <title>BGKPJR Space Pipeline · Earth → LEO → Moon → Base</title>

  <defs>
    <linearGradient id="bg-pipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#040910"/>
      <stop offset="100%" stop-color="#040910"/>
    </linearGradient>

    <radialGradient id="earth-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3a8edb"/>
      <stop offset="50%" stop-color="#1a5db5"/>
      <stop offset="100%" stop-color="#040910"/>
    </radialGradient>

    <radialGradient id="moon-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d8d8d8"/>
      <stop offset="50%" stop-color="#888888"/>
      <stop offset="100%" stop-color="#040910"/>
    </radialGradient>

    <linearGradient id="tube-trail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="tug-trail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffaa00" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffaa00" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="lander-trail" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b4ff6e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#b4ff6e" stop-opacity="0.9"/>
    </linearGradient>

    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#00e5ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow-x" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="pipe-grid" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#192e4c" stroke-width="1" opacity="0.35"/>
    </pattern>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      .display { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 700; }

      /* pod travels from earth to LEO */
      @keyframes pod-rail { 0% { transform: translate(0px, 0px); opacity: 0; } 5% { opacity: 1; } 30% { transform: translate(280px, -180px); opacity: 1; } 35% { opacity: 0; } 100% { opacity: 0; } }
      /* tug grabs pod in LEO and tows to lunar orbit */
      @keyframes tug-haul { 0%, 35% { transform: translate(280px, -180px); opacity: 0; } 38% { opacity: 1; } 70% { transform: translate(900px, -180px); opacity: 1; } 75% { opacity: 0; } 100% { opacity: 0; } }
      /* lander brings pod down to surface */
      @keyframes lander-drop { 0%, 70% { transform: translate(900px, -180px); opacity: 0; } 73% { opacity: 1; } 90% { transform: translate(900px, 0px); opacity: 1; } 95% { opacity: 0; } 100% { opacity: 0; } }
      /* regolith brick appears at end */
      @keyframes brick-appear { 0%, 88% { opacity: 0; transform: scale(0.3); } 92% { opacity: 1; transform: scale(1.1); } 96% { transform: scale(1); } 100% { opacity: 1; } }
      /* phase pulses */
      @keyframes phase-1-pulse { 0%, 100% { stroke-opacity: 0.4; } 5%, 30% { stroke-opacity: 1; } 35% { stroke-opacity: 0.4; } }
      @keyframes phase-2-pulse { 0%, 100% { stroke-opacity: 0.4; } 38%, 70% { stroke-opacity: 1; } 75% { stroke-opacity: 0.4; } }
      @keyframes phase-3-pulse { 0%, 100% { stroke-opacity: 0.4; } 73%, 90% { stroke-opacity: 1; } 95% { stroke-opacity: 0.4; } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

      .pod-fx     { animation: pod-rail 12s ease-in-out infinite; transform-origin: 0 0; }
      .tug-fx     { animation: tug-haul 12s ease-in-out infinite; transform-origin: 0 0; }
      .lander-fx  { animation: lander-drop 12s ease-in-out infinite; transform-origin: 0 0; }
      .brick-fx   { animation: brick-appear 12s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .phase-1-fx { animation: phase-1-pulse 12s ease-in-out infinite; }
      .phase-2-fx { animation: phase-2-pulse 12s ease-in-out infinite; }
      .phase-3-fx { animation: phase-3-pulse 12s ease-in-out infinite; }
      .blink-1    { animation: blink 1.8s ease-in-out infinite; }
      .blink-2    { animation: blink 2.6s ease-in-out infinite; }
      .blink-3    { animation: blink 3.3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- ─── BACKGROUND ─── -->
  <rect width="1600" height="600" fill="url(#bg-pipe)"/>
  <rect width="1600" height="600" fill="url(#pipe-grid)"/>

  <!-- starfield -->
  <g fill="#ddeeff">
    <circle cx="200" cy="80" r="0.7" class="blink-1"/>
    <circle cx="450" cy="60" r="0.6" class="blink-2"/>
    <circle cx="700" cy="100" r="0.7" class="blink-3"/>
    <circle cx="950" cy="50" r="0.6" class="blink-1"/>
    <circle cx="1200" cy="80" r="0.7" class="blink-2"/>
    <circle cx="1400" cy="120" r="0.5" class="blink-3"/>
    <circle cx="100" cy="160" r="0.5" class="blink-2"/>
    <circle cx="1500" cy="200" r="0.7" class="blink-1"/>
    <circle cx="350" cy="140" r="0.6" class="blink-3"/>
    <circle cx="850" cy="180" r="0.5" class="blink-1"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- TITLE                                                        -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <g transform="translate(800, 50)" text-anchor="middle">
    <text class="mono" font-size="11" fill="#4d6680" letter-spacing="0.32em">— BGKPJR · THE SPACE PIPELINE · 4 STAGES, 1 MISSION —</text>
  </g>
  <g transform="translate(800, 95)" text-anchor="middle">
    <text class="display" font-size="34" fill="#ddeeff">Earth → LEO → Moon → Base</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- EARTH (left) + 37km TUBE                                     -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <g transform="translate(140, 440)">
    <!-- Earth -->
    <circle cx="0" cy="0" r="80" fill="url(#earth-grad)"/>
    <!-- continents schematic -->
    <path d="M -40 -20 Q -20 -30 0 -20 Q 20 -10 30 -25 Q 10 -45 -20 -40 Z" fill="#5fa4d8" opacity="0.6"/>
    <path d="M -10 20 Q 10 15 25 25 Q 30 40 10 45 Q -15 40 -10 20 Z" fill="#5fa4d8" opacity="0.55"/>
    <!-- atmosphere ring -->
    <circle cx="0" cy="0" r="86" fill="none" stroke="#3a8edb" stroke-width="0.5" opacity="0.4"/>

    <!-- 37 km maglev tube — angled up to LEO -->
    <g transform="translate(60, -55) rotate(-25)">
      <rect x="0" y="-8" width="220" height="16" rx="4" fill="#0a1422" stroke="#00e5ff" stroke-width="1.4" class="phase-1-fx"/>
      <!-- tube coil ticks -->
      <g stroke="#00e5ff" stroke-width="0.8" opacity="0.6">
        <line x1="20" y1="-8" x2="20" y2="8"/>
        <line x1="60" y1="-8" x2="60" y2="8"/>
        <line x1="100" y1="-8" x2="100" y2="8"/>
        <line x1="140" y1="-8" x2="140" y2="8"/>
        <line x1="180" y1="-8" x2="180" y2="8"/>
      </g>
      <!-- LH₂ muzzle marker -->
      <circle cx="220" cy="0" r="3" fill="#00e5ff" filter="url(#glow-x)"/>
      <text x="220" y="-18" class="mono" font-size="8" fill="#00e5ff" text-anchor="middle" letter-spacing="0.1em">LH₂ MUZZLE</text>
    </g>

    <!-- Earth label -->
    <g transform="translate(0, 110)" text-anchor="middle">
      <text class="display" font-size="14" fill="#3a8edb">EARTH</text>
      <text y="16" class="mono" font-size="9" fill="#4d6680" letter-spacing="0.18em">37 KM RAIL · MACH 5</text>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- LEO ORBIT ARC                                                -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <g>
    <!-- LEO orbit dashed arc -->
    <path d="M 220 280 Q 800 100 1380 280" fill="none" stroke="#192e4c" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="800" y="135" class="mono" font-size="9" fill="#4d6680" text-anchor="middle" letter-spacing="0.18em">LEO · 400 km · 7,670 m/s</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- THE TRANSFER (Earth-LEO-Moon trajectory dashed)              -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <g class="phase-2-fx">
    <path d="M 420 260 Q 800 200 1180 260" fill="none" stroke="#ffaa00" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.7"/>
    <text x="800" y="185" class="mono" font-size="10" fill="#ffaa00" text-anchor="middle" letter-spacing="0.18em">TRANS-LUNAR INJECTION · 4,100 m/s Δv</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- MOON (right) + LANDER ZONE                                   -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <g transform="translate(1380, 440)">
    <!-- Moon -->
    <circle cx="0" cy="0" r="70" fill="url(#moon-grad)"/>
    <!-- crater details -->
    <circle cx="-15" cy="-20" r="6" fill="#666" opacity="0.55"/>
    <circle cx="20" cy="10" r="9" fill="#666" opacity="0.5"/>
    <circle cx="-25" cy="20" r="4" fill="#666" opacity="0.6"/>
    <circle cx="25" cy="-25" r="3" fill="#666" opacity="0.55"/>

    <!-- regolith brick (final state — appears at end of cycle) -->
    <g class="brick-fx">
      <rect x="-15" y="-78" width="30" height="14" rx="2" fill="#7c3aed" stroke="#b4ff6e" stroke-width="1.2"/>
      <rect x="-14" y="-77" width="28" height="3" fill="#b4ff6e" opacity="0.7"/>
      <text x="0" y="-94" class="mono" font-size="8" fill="#b4ff6e" text-anchor="middle" letter-spacing="0.14em">REGOLITH BRICK</text>
    </g>

    <!-- Moon label -->
    <g transform="translate(0, 100)" text-anchor="middle">
      <text class="display" font-size="14" fill="#8faec8">MOON</text>
      <text y="16" class="mono" font-size="9" fill="#4d6680" letter-spacing="0.18em">BLUE MOON Mk2 / HLS · BASE · 2029</text>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- TRAVELING ELEMENTS — POD, TUG, LANDER                        -->
  <!-- All animated with synchronized 12s loop                      -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- Pod traveling along rail (Earth → LEO) -->
  <g class="pod-fx">
    <g transform="translate(190, 440)">
      <!-- pod body -->
      <ellipse cx="0" cy="0" rx="10" ry="4" fill="#ddeeff" stroke="#00e5ff" stroke-width="0.8"/>
      <!-- amber plasma trail -->
      <rect x="-30" y="-2" width="22" height="4" rx="2" fill="url(#tube-trail)" opacity="0.8"/>
      <!-- glow -->
      <circle cx="0" cy="0" r="14" fill="url(#pulse)" opacity="0.5"/>
      <text y="-14" class="mono" font-size="8" fill="#00e5ff" text-anchor="middle" letter-spacing="0.1em">MANNA POD</text>
    </g>
  </g>

  <!-- Tug + pod (LEO → lunar orbit) -->
  <g class="tug-fx">
    <g transform="translate(190, 260)">
      <!-- pod (towed) -->
      <ellipse cx="-22" cy="0" rx="9" ry="4" fill="#ddeeff" stroke="#00e5ff" stroke-width="0.8"/>
      <!-- hitch line -->
      <line x1="-13" y1="0" x2="-2" y2="0" stroke="#ffaa00" stroke-width="1" stroke-dasharray="2 1"/>
      <!-- tug body (delivery van scale) -->
      <rect x="-2" y="-6" width="20" height="12" rx="2" fill="#ffaa00" stroke="#ffd066" stroke-width="0.8"/>
      <!-- tug solar panels -->
      <rect x="-2" y="-12" width="20" height="3" fill="#2255cc" opacity="0.85"/>
      <rect x="-2" y="9" width="20" height="3" fill="#2255cc" opacity="0.85"/>
      <!-- engine flame -->
      <polygon points="18,-3 28,0 18,3" fill="url(#tug-trail)"/>
      <!-- glow -->
      <circle cx="0" cy="0" r="22" fill="#ffaa00" opacity="0.12" filter="url(#glow-x)"/>
      <text y="-22" class="mono" font-size="8" fill="#ffaa00" text-anchor="middle" letter-spacing="0.1em">SPACE TUG</text>
    </g>
  </g>

  <!-- Lander (lunar orbit → surface) -->
  <g class="lander-fx">
    <g transform="translate(190, 260)">
      <!-- lander body (Blue Moon Mk2 silhouette) -->
      <polygon points="-8,-8 8,-8 12,8 -12,8" fill="#b4ff6e" stroke="#ddffbb" stroke-width="0.8" opacity="0.95"/>
      <!-- pod inside lander -->
      <ellipse cx="0" cy="-2" rx="6" ry="3" fill="#ddeeff" stroke="#00e5ff" stroke-width="0.5"/>
      <!-- legs -->
      <line x1="-12" y1="8" x2="-15" y2="14" stroke="#b4ff6e" stroke-width="1"/>
      <line x1="12" y1="8" x2="15" y2="14" stroke="#b4ff6e" stroke-width="1"/>
      <!-- engine flame -->
      <polygon points="-4,8 4,8 0,18" fill="url(#lander-trail)"/>
      <!-- glow -->
      <circle cx="0" cy="0" r="20" fill="#b4ff6e" opacity="0.15" filter="url(#glow-x)"/>
      <text y="-22" class="mono" font-size="8" fill="#b4ff6e" text-anchor="middle" letter-spacing="0.1em">LANDER</text>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- BOTTOM PHASE LABELS                                          -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <g transform="translate(0, 555)">
    <line x1="40" y1="0" x2="1560" y2="0" stroke="#192e4c" stroke-width="1"/>

    <g transform="translate(280, 22)" text-anchor="middle">
      <text class="mono" font-size="9" fill="#00e5ff" letter-spacing="0.18em">PHASE 1</text>
      <text y="14" class="mono" font-size="11" fill="#ddeeff" font-weight="600">BGKPJR RAIL</text>
      <text y="28" class="mono" font-size="9" fill="#4d6680" letter-spacing="0.12em">EARTH SURFACE → LEO</text>
    </g>

    <g transform="translate(680, 22)" text-anchor="middle">
      <text class="mono" font-size="9" fill="#ffaa00" letter-spacing="0.18em">PHASE 2</text>
      <text y="14" class="mono" font-size="11" fill="#ddeeff" font-weight="600">SPACE TUG</text>
      <text y="28" class="mono" font-size="9" fill="#4d6680" letter-spacing="0.12em">LEO → LUNAR ORBIT</text>
    </g>

    <g transform="translate(1080, 22)" text-anchor="middle">
      <text class="mono" font-size="9" fill="#b4ff6e" letter-spacing="0.18em">PHASE 3</text>
      <text y="14" class="mono" font-size="11" fill="#ddeeff" font-weight="600">BLUE MOON / HLS</text>
      <text y="28" class="mono" font-size="9" fill="#4d6680" letter-spacing="0.12em">ORBIT → SURFACE</text>
    </g>

    <g transform="translate(1430, 22)" text-anchor="middle">
      <text class="mono" font-size="9" fill="#a78bfa" letter-spacing="0.18em">PHASE 4</text>
      <text y="14" class="mono" font-size="11" fill="#ddeeff" font-weight="600">SPACE LEGO</text>
      <text y="28" class="mono" font-size="9" fill="#4d6680" letter-spacing="0.12em">REGOLITH-FILLED BASE</text>
    </g>
  </g>

</svg>
